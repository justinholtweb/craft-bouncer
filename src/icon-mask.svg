    <line x1="78" y1="34" x2="78" y2="86"/>
    <line x1="10" y1="90" x2="34" y2="90"/>
    <line x1="66" y1="90" x2="90" y2="90"/>
    <circle cx="22" cy="24" r="9" fill="currentColor" stroke="none"/>
    <circle cx="78" cy="24" r="9" fill="currentColor" stroke="none"/>
    <path d="M22 34 C 34 60, 66 60, 78 34" stroke-width="8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two stanchions and the rope between them: the least ambiguous picture of "you may not
         come in here" that does not involve a padlock, which every other plugin already uses. -->

<!--
  Slide watermark: the bouncer and his rope, filled white, no tile. Copied from
  ../src/icon-mask.svg — same ten paths, same transform, only the fill differs. Change the icon and
  change all three of src/icon.svg, src/icon-mask.svg and this.

  Filled rather than stroked, unlike the line-drawing marks in the family. This mark is already a
  silhouette; outlining it would trace the gap between every muscle and read as noise at 1150px.
  The cost is that it goes heavy fast, so the deck runs it at **opacity 0.022**, not the 0.05 a
  stroked mark takes — the same correction Bird's deck needed for the same reason. At 0.05 the
  figure reads as a grey man standing in the left third of every slide.
-->
